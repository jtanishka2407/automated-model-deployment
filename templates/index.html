<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris Flower Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Iris Flower Prediction</h2>

    <label>Sepal Length</label>
    <input type="number" step="0.1" id="sepal_length" placeholder="e.g. 5.1">

    <label>Sepal Width</label>
    <input type="number" step="0.1" id="sepal_width" placeholder="e.g. 3.5">

    <label>Petal Length</label>
    <input type="number" step="0.1" id="petal_length" placeholder="e.g. 1.4">

    <label>Petal Width</label>
    <input type="number" step="0.1" id="petal_width" placeholder="e.g. 0.2">

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

    <script>
        const classNames = ["Setosa", "Versicolor", "Virginica"];

        async function predict() {
            const data = {
                sepal_length: parseFloat(document.getElementById("sepal_length").value),
                sepal_width: parseFloat(document.getElementById("sepal_width").value),
                petal_length: parseFloat(document.getElementById("petal_length").value),
                petal_width: parseFloat(document.getElementById("petal_width").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById("result").innerText =
                "Predicted Class: " + classNames[result.prediction];
        }
    </script>
</body>
</html>
